name: Set up EE build tools
description: >-
  Installs ansible-builder, cosign and trivy (all pinned) on a GitHub-hosted
  Ubuntu runner, which already has buildah, podman and skopeo. Also points
  buildah, skopeo and cosign at one shared registry auth file.

inputs:
  ansible-builder:
    description: Install ansible-builder (needed only by the build job)
    default: "true"
  ghcr-token:
    description: If set, log in to ghcr.io as the workflow actor with this token
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      if: inputs.ansible-builder == 'true'
      with:
        python-version: "3.12"

    - name: Install ansible-builder
      if: inputs.ansible-builder == 'true'
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "ansible-builder==3.2.0"

    - name: Allow rootless user namespaces
      shell: bash
      # Ubuntu 24.04 can restrict unprivileged user namespaces via AppArmor,
      # which breaks rootless buildah. No-op where the knob does not exist.
      run: |
        if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

    - name: Install cosign and trivy from digest-pinned images
      shell: bash
      env:
        # Keep these in sync with ee-deps/ci-tools/Containerfile.
        # cosign stays on v2.x: the workflows use its key-pair, no-Rekor flags.
        COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v2.6.1@sha256:68839b7f13dac5a6744a5d8818e984dd39183374e37855c19e14d623d9bc9037
        TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/ee-tools/bin"
        mkdir -p "$bin" "$RUNNER_TEMP/ee-tools/auth"
        copy_from_image() {
          local ctr
          ctr=$(podman create --quiet "$1")
          podman cp "$ctr:$2" "$bin/"
          podman rm "$ctr" >/dev/null
        }
        copy_from_image "$COSIGN_IMAGE" /ko-app/cosign
        copy_from_image "$TRIVY_IMAGE" /usr/local/bin/trivy
        echo "$bin" >> "$GITHUB_PATH"
        # one auth file for buildah, skopeo and cosign, outside the workspace
        echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/ee-tools/auth/config.json" >> "$GITHUB_ENV"
        echo "DOCKER_CONFIG=$RUNNER_TEMP/ee-tools/auth" >> "$GITHUB_ENV"

    - name: Log in to ghcr.io
      if: inputs.ghcr-token != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.ghcr-token }}
      run: printf '%s' "$TOKEN" | buildah login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io

    - name: Tool versions
      shell: bash
      run: |
        buildah --version
        skopeo --version
        cosign version
        trivy --version
        if command -v ansible-builder >/dev/null; then ansible-builder --version; fi
