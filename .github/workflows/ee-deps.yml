# ee-deps: heavy dependency EE, built on GitHub (connected side).
#
#   pull request    create -> build -> smoke test -> secret check -> scan   nothing pushed
#   main / weekly   ... -> push ghcr.io/<owner>/ee-deps:<short-sha> -> cosign sign
#   tag ee-deps-vX.Y.Z
#                   ... -> push :vX.Y.Z (immutable) -> sign -> transfer bundle artifact
#
# Repository secrets:
#   RH_REGISTRY_USER / RH_REGISTRY_PASSWORD  registry.redhat.io service account
#   RH_AUTOMATION_HUB_TOKEN                  optional: certified content from console.redhat.com
# Environment "signing" (deployment branches/tags: main and ee-deps-v*):
#   secrets COSIGN_PRIVATE_KEY (PEM content of cosign.key), COSIGN_PASSWORD
# Repository variables:
#   COSIGN_PUBLIC_KEY      PEM content of cosign.pub
#   TRIVY_IGNORE_UNFIXED   optional: "true" ignores CVEs that have no fix yet
name: ee-deps

on:
  pull_request:
    paths:
      - ee-deps/**
      - .github/workflows/ee-deps.yml
      - .github/actions/setup-ee-tools/**
  push:
    branches: [main]
    tags: ["ee-deps-v*"] # path filters are not applied to tag pushes
    paths:
      - ee-deps/**
      - .github/workflows/ee-deps.yml
      - .github/actions/setup-ee-tools/**
  schedule:
    - cron: "17 3 * * 1" # weekly rebuild + rescan to pick up errata and new CVE data
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ee-deps-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPECTED_COLLECTIONS: amazon.aws community.aws
  TRIVY_IGNORE_UNFIXED: ${{ vars.TRIVY_IGNORE_UNFIXED || 'false' }}
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivycache

jobs:
  # ------------------------------------------------------------------------
  # build: create -> build -> smoke test -> secret check -> scan -> push
  # The image only exists on this runner, so it is tested and scanned here
  # and pushed only once every gate has passed.
  # ------------------------------------------------------------------------
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ee-deps
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      publish: ${{ steps.meta.outputs.publish }}
      release: ${{ steps.meta.outputs.release }}
      image_ref: ${{ steps.push.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ee-tools
        with:
          ghcr-token: ${{ github.token }}

      - name: Image name and tag
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ee-deps"
          publish=false release=false
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            tag="pr-$PR_NUMBER"
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            if [[ $GITHUB_REF_NAME =~ ^ee-deps-(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
              tag=${BASH_REMATCH[1]} publish=true release=true
            else
              echo "::error::release tags must look like ee-deps-v1.2.3 (got $GITHUB_REF_NAME)"
              exit 1
            fi
          elif [[ $GITHUB_REF_NAME == "$DEFAULT_BRANCH" ]]; then
            tag=${GITHUB_SHA::7} publish=true
          else
            tag="dev-${GITHUB_SHA::7}" # manual run on another branch: build only
          fi
          {
            echo "image_name=$image_name"
            echo "image_tag=$tag"
            echo "image=$image_name:$tag"
            echo "publish=$publish"
            echo "release=$release"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Log in to registry.redhat.io
        env:
          RH_REGISTRY_USER: ${{ secrets.RH_REGISTRY_USER }}
          RH_REGISTRY_PASSWORD: ${{ secrets.RH_REGISTRY_PASSWORD }}
        run: |
          if [[ -z $RH_REGISTRY_USER || -z $RH_REGISTRY_PASSWORD ]]; then
            echo "::error::RH_REGISTRY_USER / RH_REGISTRY_PASSWORD secrets are not available (fork PR?)"
            exit 1
          fi
          printf '%s' "$RH_REGISTRY_PASSWORD" | buildah login --authfile "$REGISTRY_AUTH_FILE" \
            --username "$RH_REGISTRY_USER" --password-stdin registry.redhat.io

      - name: ansible-builder create
        run: |
          echo "base image: $(scripts/base-image.sh execution-environment.yml)"
          ansible-builder create -v 3 -f execution-environment.yml -c context --output-filename Containerfile
          cat context/Containerfile

      - name: buildah build
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          RH_AUTOMATION_HUB_TOKEN: ${{ secrets.RH_AUTOMATION_HUB_TOKEN }}
        run: |
          galaxy_args=()
          if [[ -n $RH_AUTOMATION_HUB_TOKEN ]]; then
            # consumed by ARGs in the intermediate galaxy stage only
            galaxy_args+=(
              --build-arg "ANSIBLE_GALAXY_SERVER_LIST=certified,validated,galaxy"
              --build-arg "ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN=$RH_AUTOMATION_HUB_TOKEN"
              --build-arg "ANSIBLE_GALAXY_SERVER_VALIDATED_TOKEN=$RH_AUTOMATION_HUB_TOKEN"
            )
          fi
          buildah build --layers=false --format oci \
            --file context/Containerfile \
            --tag "$IMAGE" \
            --label org.opencontainers.image.title=ee-deps \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "${galaxy_args[@]}" \
            context

      - name: Smoke test
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          read -ra collections <<<"$EXPECTED_COLLECTIONS"
          scripts/smoke-test.sh "$IMAGE" "${collections[@]}"

      - name: Secret check
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          RH_AUTOMATION_HUB_TOKEN: ${{ secrets.RH_AUTOMATION_HUB_TOKEN }}
          RH_REGISTRY_PASSWORD: ${{ secrets.RH_REGISTRY_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/check-no-secrets.sh "$IMAGE" RH_AUTOMATION_HUB_TOKEN RH_REGISTRY_PASSWORD GITHUB_TOKEN

      - uses: actions/cache@v4
        with:
          path: .trivycache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Scan (fail on CRITICAL) + SBOM
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          buildah push "$IMAGE" oci-archive:image.oci.tar
          trivy image --input image.oci.tar --format cyclonedx --output sbom.cdx.json
          trivy image --input image.oci.tar --scanners vuln --format json --output trivy-report.json
          trivy image --input image.oci.tar --scanners vuln --severity CRITICAL --exit-code 1
          rm -f image.oci.tar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ee-deps-reports-${{ steps.meta.outputs.image_tag }}
          path: |
            ee-deps/sbom.cdx.json
            ee-deps/trivy-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Push
        id: push
        if: steps.meta.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          RELEASE: ${{ steps.meta.outputs.release }}
        run: |
          if [[ $RELEASE == true ]] && skopeo inspect --raw "docker://$IMAGE" >/dev/null 2>&1; then
            echo "::error::$IMAGE already exists - release tags are immutable"
            exit 1
          fi
          buildah push --digestfile image.digest "$IMAGE" "docker://$IMAGE"
          echo "image_ref=$IMAGE_NAME@$(cat image.digest)" | tee -a "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------------
  # sign by digest: key pair, no public transparency log, so the signature
  # can be verified offline inside the air gap
  # ------------------------------------------------------------------------
  sign:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: signing
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ee-tools
        with:
          ansible-builder: "false"
          ghcr-token: ${{ github.token }}

      - name: cosign sign + verify
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          [[ -n $IMAGE_REF ]] || { echo "::error::image_ref missing from build job"; exit 1; }
          cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY \
            -a "tag=$IMAGE_TAG" -a "revision=$GITHUB_SHA" "$IMAGE_REF"
          printf '%s\n' "$COSIGN_PUBLIC_KEY" > "$RUNNER_TEMP/cosign.pub"
          cosign verify --key "$RUNNER_TEMP/cosign.pub" --insecure-ignore-tlog=true "$IMAGE_REF" | jq .

  # ------------------------------------------------------------------------
  # transfer bundle for the air gap (release tags only)
  # ------------------------------------------------------------------------
  export-bundle:
    needs: [build, sign]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    environment: signing
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ee-deps
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ee-tools
        with:
          ansible-builder: "false"
          ghcr-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: ee-deps-reports-${{ needs.build.outputs.image_tag }}
          path: ee-deps/reports

      - name: Export bundle
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: scripts/export-bundle.sh "$IMAGE_REF" "$IMAGE_TAG" reports/sbom.cdx.json bundle

      - uses: actions/upload-artifact@v4
        with:
          name: ee-deps-${{ needs.build.outputs.image_tag }}
          path: ee-deps/bundle/
          if-no-files-found: error
          compression-level: 0 # layers are already compressed
          retention-days: 90
