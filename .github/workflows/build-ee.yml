name: Build EE

# Every merge to main is a release: each ee/<version>/ image is pushed as
# :<version> (moving) and :<ansible-core>-<date>-<sha> (never changes), and
# uploaded as an air-gap artifact. Pull requests and branch runs only build and test.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # One image per ee/<ansible-core major.minor>/ folder: add a folder to build
  # another version, delete it to stop.
  versions:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: |
          versions=()
          for d in ee/*/; do
            [[ -f ${d}execution-environment.yml ]] || continue
            v=$(basename "$d")
            if [[ ! $v =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::folder ee/$v must be named after an ansible-core version, e.g. ee/2.20"
              exit 1
            fi
            versions+=("$v")
          done
          if (( ${#versions[@]} == 0 )); then
            echo "::error::no ee/<version>/execution-environment.yml found"
            exit 1
          fi
          list=$(printf '%s\n' "${versions[@]}" | sort -V | jq -Rnc '[inputs]')
          echo "versions: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.list) }}
    name: build (ansible-core ${{ matrix.version }})
    env:
      EE_FILE: ee/${{ matrix.version }}/execution-environment.yml
      ANSIBLE_CORE: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ansible-builder
        run: pip install ansible-builder==3.2.0

      - name: Set image name
        run: |
          # Built under a local name; tagged with the ansible-core version after the smoke test.
          echo "REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ansible-ee" >> "$GITHUB_ENV"
          echo "IMAGE=localhost/ansible-ee:build-$ANSIBLE_CORE" >> "$GITHUB_ENV"

      - name: Log in to registries
        env:
          RH_USER: ${{ secrets.RH_REGISTRY_USER }}
          RH_PASSWORD: ${{ secrets.RH_REGISTRY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z $RH_USER || -z $RH_PASSWORD ]]; then
            echo "::error::Add repository secrets RH_REGISTRY_USER and RH_REGISTRY_PASSWORD (Settings > Secrets and variables > Actions). Use a registry.redhat.io service account: https://access.redhat.com/terms-based-registry/"
            exit 1
          fi
          echo "$RH_PASSWORD" | podman login -u "$RH_USER" --password-stdin registry.redhat.io
          echo "$GH_TOKEN" | podman login -u "$GITHUB_ACTOR" --password-stdin ghcr.io

      - name: Check base image digest
        run: |
          base=$(python -c 'import os, yaml; print(yaml.safe_load(open(os.environ["EE_FILE"]))["images"]["base_image"]["name"])')
          if [[ ! $base =~ @sha256:[0-9a-f]{64}$ ]]; then
            repo=${base%@*}
            # Red Hat AAP repos have no "latest" tag: take the newest version tag
            versions=$(skopeo list-tags "docker://$repo" | jq -r '.Tags[]' \
              | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9]+)?$' | sort -V)
            echo "newest version tags:"; tail -n5 <<<"$versions"
            newest=$(tail -n1 <<<"$versions")
            digest=$(skopeo inspect --format '{{.Digest}}' "docker://$repo:$newest")
            echo "::error::base_image in $EE_FILE is not pinned. Newest tag is $newest - set it to: $repo@$digest"
            exit 1
          fi
          echo "base image: $base"

      - name: Build
        run: ansible-builder build -v 3 -f "$EE_FILE" -t "$IMAGE" --container-runtime podman

      - name: Smoke test
        run: |
          podman run --rm "$IMAGE" ansible --version
          podman run --rm "$IMAGE" ansible --version | head -n1 | grep -F "[core $ANSIBLE_CORE."
          podman run --rm "$IMAGE" ansible-galaxy collection list
          podman run --rm -v "$PWD/.github/check_collections.py:/tmp/check_collections.py:ro" "$IMAGE" python3 /tmp/check_collections.py
          podman run --rm "$IMAGE" python3 -c "import boto3, botocore; print(boto3.__version__, botocore.__version__)"
          podman run --rm "$IMAGE" python3 -c "import jmespath, netaddr, passlib, dns, xmltodict"
          podman run --rm "$IMAGE" python3 -c "import pyVmomi, kubernetes, docker, winrm, pypsrp, psycopg2, pymysql, hvac"
          podman run --rm "$IMAGE" rsync --version
          podman run --rm "$IMAGE" jq --version
          podman run --rm "$IMAGE" yq --version
          podman run --rm "$IMAGE" python3 -c "import jq; print(jq.compile('.a').input_value({'a': 1}).first())"
          podman run --rm "$IMAGE" helm version
          podman run --rm "$IMAGE" oc version --client
          podman run --rm "$IMAGE" argocd version --client

      - name: Tag with the ansible-core version
        run: |
          # :2.20 moves to the newest build; :2.20.10-20261103-a1b2c3d never changes
          core=$(podman run --rm "$IMAGE" python3 -c 'from ansible.release import __version__ as v; print(v)')
          minor=${core%.*}
          if [[ $minor != "$ANSIBLE_CORE" ]]; then
            echo "::error::image has ansible-core $core, expected $ANSIBLE_CORE.x"
            exit 1
          fi
          stamp="$core-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          tags="$minor $stamp"
          for t in $tags; do podman tag "$IMAGE" "$REPO:$t"; done
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          echo "TAG=$stamp" >> "$GITHUB_ENV"
          echo "image tags: $tags"

      - name: Push
        if: github.ref == 'refs/heads/main'
        run: for t in $TAGS; do podman push "$REPO:$t"; done

      - name: Save image for the air gap
        if: github.ref == 'refs/heads/main'
        run: |
          podman save --format oci-archive -o "ansible-ee-$TAG.tar" "$REPO:$TAG"
          sha256sum "ansible-ee-$TAG.tar" > "ansible-ee-$TAG.tar.sha256"

      - uses: actions/upload-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          name: ansible-ee-${{ env.TAG }}
          path: ansible-ee-*.tar*
          compression-level: 0
          retention-days: 30
