---
version: 3

images:
  base_image:
    # AAP 2.7 minimal EE, pinned by digest. The repo has no "latest" tag:
    #   skopeo list-tags docker://registry.redhat.io/ansible-automation-platform-27/ee-minimal-rhel9
    #   skopeo inspect --format '{{.Digest}}' docker://registry.redhat.io/ansible-automation-platform-27/ee-minimal-rhel9:<newest-tag>
    # (CI prints the current value when this is not pinned.)
    name: registry.redhat.io/ansible-automation-platform-27/ee-minimal-rhel9@sha256:f6a067ac59c833281934249badf947ad64d5de75cc790b2ccf1d8ea61b54d469  # tag 2.20-1793110779

dependencies:
  galaxy: requirements.yml     # collections; their Python deps (boto3, botocore) are added automatically
  python: requirements.txt     # extra pip packages only
  system: bindep.txt           # RPMs

  # ansible-core in this base runs on Python 3.12, not RHEL's platform Python 3.9.
  python_interpreter:
    python_path: /usr/bin/python3.12

  # Some collections declare RPMs built for RHEL's Python 3.9. Installing them
  # pulls in Python 3.9, which takes over /usr/bin/python3 (no pip, no boto3).
  # pip installs the same libraries for Python 3.12 instead.
  exclude:
    system:
      - python3-cffi            # ansible.netcommon
      - python3-cryptography    # ansible.netcommon, community.crypto
      - python3-Cython          # ansible.netcommon
      - python3-devel           # microsoft.ad (python3.12-devel is in bindep.txt)
      - python3-lxml            # ansible.netcommon
      - python3-pycparser       # ansible.netcommon
      - python3-six             # ansible.netcommon
      - cryptsetup              # community.crypto luks_device - runs on managed hosts, pulls in systemd
    python:
      - pytest-mock             # community.postgresql test dependency

options:
  package_manager_path: /usr/bin/microdnf
