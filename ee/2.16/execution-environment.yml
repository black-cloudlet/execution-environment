---
# ansible-core 2.16, for managed hosts that only have Python 3.6 (RHEL 8).
# Newer ansible-core needs a newer Python on targets; 2.16 is the last
# version supporting 3.6. Same packages and tools as ../2.20/ - keep in sync.
version: 3

images:
  base_image:
    # Red Hat's AAP 2.7 minimal EE with ansible-core 2.16 (the 2.16-* tags),
    # pinned to one build tag. Red Hat publishes a new tag per build, so this one
    # stays fixed. CI notes when a newer 2.16 build exists. List the tags with:
    #   skopeo list-tags docker://registry.redhat.io/ansible-automation-platform-27/ee-minimal-rhel9
    name: registry.redhat.io/ansible-automation-platform-27/ee-minimal-rhel9:2.16-1793353171

dependencies:
  galaxy: requirements.yml     # collection versions that still support ansible-core 2.16
  python: ../../requirements.txt  # extra pip packages, shared by all versions
  system: ../../bindep.txt        # RPMs, shared by all versions

  # Must match this folder's name (CI checks it). The base already ships 2.16,
  # so this is a no-op until the base image changes.
  ansible_core:
    package_pip: ansible-core==2.16.*

  # ansible-core in this base runs on Python 3.12, not RHEL's platform Python 3.9.
  python_interpreter:
    python_path: /usr/bin/python3.12

  # Some collections declare RPMs built for RHEL's Python 3.9. Installing them
  # pulls in Python 3.9, which takes over /usr/bin/python3 (no pip, no boto3).
  # pip installs the same libraries for Python 3.12 instead.
  exclude:
    system:
      - python3-cffi            # ansible.netcommon
      - python3-cryptography    # ansible.netcommon, community.crypto
      - python3-Cython          # ansible.netcommon
      - python3-devel           # some collections (python3.12-devel is in bindep.txt)
      - python3-lxml            # ansible.netcommon
      - python3-pycparser       # ansible.netcommon
      - python3-six             # ansible.netcommon
      - cryptsetup              # community.crypto luks_device - runs on managed hosts, pulls in systemd
    python:
      - pytest-mock             # community.postgresql test dependency

additional_build_steps:
  # CLI tools copied from their official images (helm/argocd by digest, oc by Red Hat tag).
  append_final:
    - COPY --from=docker.io/alpine/helm:3.22.1@sha256:8191701ad1f82ee3695c87211fcbfe6d7b1bb7df92ac1c8de9ccdb0995a6a2c1 /usr/bin/helm /usr/local/bin/helm
    # Red Hat's supported oc for OpenShift 4.20. The v4.20 tag follows the latest
    # 4.20.z, so each rebuild picks up oc fixes. Bump it when the cluster is upgraded.
    - COPY --from=registry.redhat.io/openshift4/ose-cli-rhel9:v4.20 /usr/bin/oc /usr/local/bin/oc
    - COPY --from=quay.io/argoproj/argocd:v3.5.6@sha256:8e5cc5bb008df8a09dba439462e58c94c55b7735888d3ebde0c25fc05e4e5335 /usr/local/bin/argocd /usr/local/bin/argocd

options:
  package_manager_path: /usr/bin/microdnf
