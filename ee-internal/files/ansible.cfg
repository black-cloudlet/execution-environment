# Used only by ansible-galaxy in the intermediate galaxy build stage. It is not
# copied into the final image.
#
# The token is NOT stored here. ansible-galaxy reads it from
# ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_TOKEN, a build ARG passed by CI with
# --build-arg (from the PAH_TOKEN CI variable).

[galaxy]
server_list = automation_hub

[galaxy_server.automation_hub]
# Repository holding the internal collections. Public/certified content comes
# from the ee-deps base image, not from here.
url = https://pah.example.internal/api/galaxy/content/published/
validate_certs = true
